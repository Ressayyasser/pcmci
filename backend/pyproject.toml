[project]
name = "fair-flow-ocp"
version = "0.1.0"
description = "PCMCI-based anomaly detection and RL optimization for OCP cogeneration systems"
requires-python = ">=3.10"

dependencies = [
  "pandas>=2.0.0",
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0",
  "scipy>=1.11.0",
  "tigramite>=5.2.0",
  "fastapi>=0.104.0",
  "uvicorn>=0.24.0",
  "pydantic>=2.4.0",
  "plotly>=5.17.0",
  "dash>=2.14.0",
  "joblib>=1.3.0",
  "python-dotenv>=1.0.0",
  "pytz>=2023.3",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
